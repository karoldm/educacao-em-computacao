<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Laboratório de Filtros</title>
  <link rel="stylesheet" href="style.css" />
  <header>
    <div class="brand">
      <span id="logo" aria-hidden="true"></span>
      <h1>Laboratório de Filtros</h1>
    </div>
    <ol class="steps" id="steps" aria-label="Etapas"></ol>
  </header>
  <main id="main"></main>
  <script src="engine.js"></script>
  <script src="game.js"></script>
  <script>
    const $ = (s) => document.querySelector(s),
      esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
    const LEAF = [
      "......GG",
      "....GGGG",
      "...GGdGG",
      "..GGGdG.",
      ".GGGdGG.",
      "GGGdGG..",
      ".ddG....",
      "d.......",
    ];
    $("#logo").innerHTML =
      `<svg viewBox="0 0 8 8" width="44" height="44" shape-rendering="crispEdges">${LEAF.map((r, y) => [...r].map((c, x) => (c == "." ? "" : `<rect x="${x}" y="${y}" width="1" height="1" fill="${c == "G" ? "#3ddc97" : "#241b3a"}"/>`)).join("")).join("")}</svg>`;
    const PH = Game.STAGES,
      SC = ["v", "k", "b", "y", "g", "y", "o", "k"],
      FN = Object.keys(E.F),
      nm = (n) => E.F[n].nome;
    const BL = {
      add: "p = p + X",
      sub: "p = p - X",
      inv: "p = 255 - p",
      min0: "SE p < 0, então p = 0",
      max255: "SE p > 255, então p = 255",
      thr: "SE p < X, então p = 0; SENÃO p = 255",
      edge: "BORDA: p = ABSOLUTO((p * 4) - E - D - C - B) (máx. 255)",
      blur: "SUAVIZAR: p = média de p e dos 8 vizinhos",
    };
    const BOOK =
      "https://drive.google.com/file/d/1o1cbUXzI7vCnaJ9BBb4ftBJOAk7DszAo/view?usp=sharing";
    const bookCard = (t, d) =>
      `<div class="card"><h3>${t}</h3><p>${d}</p><a href="${BOOK}" target="_blank" rel="noopener noreferrer">Abrir o livro (Google Drive)</a></div>`;
    /* Tudo roda no navegador; o progresso fica no localStorage deste aparelho. */
    const KEY = "pdi_state";
    const load = () => {
        try {
          const s = JSON.parse(localStorage.getItem(KEY));
          return s && s.v === Game.VERSION ? s : null;
        } catch (e) {
          return null;
        }
      },
      save = () => {
        try {
          localStorage.setItem(KEY, JSON.stringify(S));
        } catch (e) {}
      };
    let S = load(),
      IMG = null,
      chain = [],
      blocks = S ? S.blocks.map((b) => ({ ...b })) : [],
      res = null,
      err = null,
      gfb = null,
      ans = S && S.quizAns ? S.quizAns.slice() : [],
      up = null,
      L = { x: 40, y: 30 },
      PAINT = [],
      cn = 0;
    const me = () => IMG || (IMG = Game.image(S)),
      msg = (t) => {
        const m = $("#msg");
        if (m) m.textContent = "⚠ " + t;
      };
    const cv = (img, w, mark) => {
      const id = "c" + cn++;
      PAINT.push([id, img, mark]);
      return `<canvas id="${id}" width="${img.w}" height="${img.h}" style="width:${typeof w == "number" ? w + "px" : w}" ${mark ? 'tabindex="0" onclick="pick(event,this)" aria-label="Imagem. Clique para mover a lupa"' : 'role="img" aria-label="Imagem"'}></canvas>`;
    };
    const paint = () =>
      PAINT.splice(0).forEach(([id, img, mark]) => {
        const c = document.getElementById(id);
        if (!c) return;
        const x = c.getContext("2d"),
          im = x.createImageData(img.w, img.h);
        for (let i = 0; i < img.d.length; i++) {
          const v = Math.max(0, Math.min(255, img.d[i]));
          im.data.set([v, v, v, 255], i * 4);
        }
        x.putImageData(im, 0, 0);
        if (mark) {
          x.strokeStyle = "#ff5ea8";
          x.lineWidth = 1;
          x.strokeRect(L.x + 0.5, L.y + 0.5, 7, 7);
        }
      });
    const pick = (e, c) => {
      const r = c.getBoundingClientRect();
      L.x = Math.max(
        0,
        Math.min(
          c.width - 8,
          Math.round(((e.clientX - r.left) / r.width) * c.width - 4),
        ),
      );
      L.y = Math.max(
        0,
        Math.min(
          c.height - 8,
          Math.round(((e.clientY - r.top) / r.height) * c.height - 4),
        ),
      );
      render();
    };
    const tbl = (m, o) =>
      `<table class="m" aria-label="${o}">` +
      E.patch(m, L.x, L.y)
        .map(
          (r) =>
            `<tr>${r
              .map((v) => {
                const c = Math.max(0, Math.min(255, v)),
                  b = v !== c;
                return `<td ${b ? 'class="bad"' : ""} style="background:rgb(${c},${c},${c});color:${c > 127 ? "#000" : "#fff"}">${v}${b ? "!" : ""}</td>`;
              })
              .join("")}</tr>`,
        )
        .join("") +
      "</table>";
    const lens = (a, b) =>
      `<div class="card"><h3>Lupa: pixels e números (8×8)</h3><p>Clique na imagem ou use os controles. Cada número é a intensidade do pixel (0 = preto, 255 = branco).</p><label>Horizontal <input type="range" min="0" max="${a.w - 8}" value="${L.x}" onchange="L.x=+this.value;render()"></label> <label>Vertical <input type="range" min="0" max="${a.h - 8}" value="${L.y}" onchange="L.y=+this.value;render()"></label><div class="row"><div><b>Antes</b>${tbl(a, "Antes")}</div><div><b>Depois</b>${tbl(b, "Depois")}</div></div></div>`;
    function chainHTML(max) {
      return (
        `<h3>Sequência (${chain.length}/${max})</h3>` +
        (chain.length
          ? `<ol>${chain.map((n, i) => `<li>${nm(n)} <button aria-label="Subir" onclick="mv(${i},-1)">↑</button><button aria-label="Descer" onclick="mv(${i},1)">↓</button><button aria-label="Remover" onclick="rm(${i})">✕</button></li>`).join("")}</ol>`
          : "<p>Vazia — escolha um filtro.</p>") +
        FN.map(
          (n) => `<button onclick="add('${n}',${max})">+ ${nm(n)}</button>`,
        ).join("") +
        `<button onclick="chain=[];render()">Limpar</button>`
      );
    }
    const touch = () => {
      if (chain.length && S.stage === 1 && !S.applied) {
        S.applied = 1;
        save();
      }
    }; // aplicou pelo menos um filtro: libera o Continuar
    const add = (n, m) => {
        if (chain.length < m) {
          chain.push(n);
          touch();
          render();
        }
      },
      rm = (i) => {
        chain.splice(i, 1);
        render();
      },
      mv = (i, d) => {
        const j = i + d;
        if (j < 0 || j >= chain.length) return;
        [chain[i], chain[j]] = [chain[j], chain[i]];
        render();
      };
    const pcBox = () =>
      chain.length
        ? `<pre>${esc(E.chainPseudo(chain))}</pre><p>${E.F[chain.at(-1)].exp}</p>`
        : "<pre>(vazio)</pre><p>Adicione um filtro para ver o pseudocódigo.</p>";
    /* Etapa 1: só a imagem (qualquer imagem vira preto e branco) */
    const upPrev = () =>
      up
        ? (up.ok
            ? `<div class="row"><div><b>Original</b><br><img class="pv" alt="Prévia da imagem escolhida" src="${up.src}" style="width:192px"></div><div><b>Preto e branco</b><br>${cv(up.img, 192)}</div></div>`
            : "") + `<p class="${up.ok ? "" : "err"}">${esc(up.msg)}</p>`
        : "";
    const join = () =>
      `<div class="card"><h2>Etapa 1 · Entrada</h2><p>Escolha <b>qualquer imagem</b> do seu aparelho (colorida ou não). Ela será recortada em 4:3, reduzida para 96 × 72 pixels e <b>convertida para preto e branco</b>. A imagem fica só no seu navegador.</p><p><input id="fl" type="file" accept="image/*" aria-label="Imagem do seu aparelho" onchange="onFile(this.files[0])"></p><div id="prev">${upPrev()}</div><button id="jb" class="p" ${up && up.ok ? "" : "disabled"} onclick="begin()">Começar</button></div>`;
    const showPrev = () => {
      const p = $("#prev");
      if (p) {
        PAINT = [];
        p.innerHTML = upPrev();
        paint();
      }
      const b = $("#jb");
      if (b) b.disabled = !(up && up.ok);
    };
    async function onFile(f) {
      up = null;
      if (!f) {
        showPrev();
        return;
      }
      try {
        if (f.size > 8e6) throw new Error("Arquivo muito grande (máx. 8 MB).");
        const bmp = await createImageBitmap(f),
          c = document.createElement("canvas");
        c.width = E.W;
        c.height = E.H;
        const x = c.getContext("2d", { willReadFrequently: true });
        x.fillStyle = "#fff";
        x.fillRect(0, 0, E.W, E.H);
        x.imageSmoothingQuality = "high";
        const sw = Math.min(bmp.width, (bmp.height * 4) / 3),
          sh = (sw * 3) / 4;
        x.drawImage(
          bmp,
          (bmp.width - sw) / 2,
          (bmp.height - sh) / 2,
          sw,
          sh,
          0,
          0,
          E.W,
          E.H,
        );
        const px = x.getImageData(0, 0, E.W, E.H).data,
          rgb = new Uint8Array(E.W * E.H * 3);
        for (let i = 0; i < E.W * E.H; i++) {
          rgb[3 * i] = px[4 * i];
          rgb[3 * i + 1] = px[4 * i + 1];
          rgb[3 * i + 2] = px[4 * i + 2];
        }
        const k = E.bwCheck(rgb);
        up = {
          ok: true,
          img: E.grayFromRgb(rgb),
          src: c.toDataURL(),
          msg: k.ok
            ? "✔ Imagem pronta (já era preto e branco)."
            : "✔ Imagem colorida convertida para preto e branco.",
        };
      } catch (e) {
        up = {
          ok: false,
          msg:
            "✘ " +
            (/^Arquivo/.test(e.message)
              ? e.message
              : "Não consegui ler esse arquivo como imagem."),
        };
      }
      showPrev();
    }
    const resetLocal = () => {
      chain = [];
      res = err = null;
      gfb = null;
    };
    function begin() {
      S = Game.newState(up.img);
      IMG = up.img;
      blocks = [];
      ans = [];
      resetLocal();
      save();
      render();
    }
    function next() {
      try {
        Game.next(S, Date.now());
        save();
        resetLocal();
        render();
        if (typeof scrollTo == "function") scrollTo(0, 0);
      } catch (e) {
        const m = $("#nmsg");
        if (m) m.textContent = "⚠ " + e.message;
      }
    }
    function restart() {
      if (!confirm("Apagar seu progresso e começar de novo?")) return;
      try {
        localStorage.removeItem(KEY);
      } catch (e) {}
      S = null;
      IMG = null;
      up = null;
      ans = [];
      blocks = [];
      resetLocal();
      render();
    }
    /* Etapa 2: Aplicar (a lupa de pixels existe só aqui) */
    const aplicar = () => {
      const o = me(),
        r = E.apply(o, chain);
      return `<h2>Etapa 2 · Aplicar</h2><p>Experimente filtros na sua imagem e combine-os, inclusive <b>Suavizar</b> e <b>Borda</b> (que olham os vizinhos de cada pixel). Quando quiser, clique em Continuar.</p><div class="g2"><div class="card"><h3>Original</h3>${cv(o, "100%", 1)}</div><div class="card"><h3>Resultado</h3>${cv(r, "100%", 1)}</div></div><div class="g2"><div class="card">${chainHTML(6)}</div><div class="card"><h3>Pseudocódigo</h3>${pcBox()}</div></div>${lens(o, r)}`;
    };
    /* Etapa 3: Analisar (minijogo Filtro Misterioso) */
    const waiting = (v) => v.done || (gfb && gfb.ok),
      hud = (v) =>
        `<div class="hud"><span>RODADA ${Math.min(v.round + 1, v.total)}/${v.total}</span><span>PONTOS ${v.score}</span><span>ERROS ${v.wrong}</span><span>TEMPO <b id="tm">${waiting(v) || !S.game.t0 ? "-" : Math.floor((Date.now() - S.game.t0) / 1000)}</b>s</span></div>`;
    const final = (v) =>
      `<div class="card"><h3>Fim de jogo!</h3><p>Você fez <b>${v.score}</b> pontos.</p><table class="rk"><tr><th>Rodada</th><th>Pontos</th><th>Tempo</th><th>Erros</th></tr>${v.rounds.map((x, i) => `<tr><td>${i + 1}</td><td>${x.pts}${x.solved ? "" : " (pulou)"}</td><td>${x.secs}s</td><td>${x.wrong}</td></tr>`).join("")}</table><p>Clique em Continuar para ver o seu feedback.</p></div>`;
    const misterioso = () => {
      const v = Game.gview(S, Date.now()),
        head =
          "<h2>Etapa 3 · Analisar</h2><p><b>Minijogo: Filtro Misterioso</b></p>";
      if (v.done) return head + hud(v) + final(v);
      if (gfb && gfb.ok)
        return (
          head +
          hud(v) +
          `<div class="card"><h3>✔ Acertou! +${gfb.pts} pontos</h3><p>Filtros: <b>${gfb.expected.map(nm).join(" → ")}</b>${gfb.exact ? "" : " (a sua sequência é equivalente)"} · ${gfb.secs}s.</p><pre>${esc(E.chainPseudo(gfb.expected))}</pre><p>O tempo da próxima rodada só começa quando você clicar.</p><button class="p" onclick="nextRound()">Próxima rodada →</button></div>`
        );
      const o = me(),
        r = E.apply(o, chain);
      return (
        head +
        hud(v) +
        `<p>Um filtro misterioso transformou a <b>sua imagem</b> na imagem-alvo. Descubra a sequência de filtros. Cada erro custa 10 pontos e o tempo também desconta. Montar e visualizar é de graça: só o envio vale!</p><div class="row"><div class="card"><h3>Original</h3>${cv(o, 240)}</div><div class="card"><h3>Alvo</h3>${cv(v.target, 240)}</div><div class="card"><h3>Seu teste</h3>${cv(r, 240)}</div></div><div class="g2"><div class="card">${chainHTML(v.len)}<p><button class="p" ${chain.length != v.len ? "disabled" : ""} onclick="guess()">Enviar palpite</button> <button onclick="skip()">Pular rodada (0 pts)</button> <span id="msg" role="status"></span></p></div><div class="card"><h3>Pseudocódigo do seu teste</h3><pre>${chain.length ? esc(E.chainPseudo(chain)) : "(vazio)"}</pre></div></div>` +
        (gfb && !gfb.ok
          ? `<div class="card"><p class="err">✘ Ainda não! Seu resultado é ${Math.round(gfb.match * 100)}% parecido com o alvo.</p><div class="bar" style="width:${Math.round(gfb.match * 100)}%"></div></div>`
          : "")
      );
    };
    function guess() {
      try {
        gfb = Game.guess(S, chain, Date.now());
        if (gfb.ok) chain = [];
        save();
        render();
      } catch (e) {
        msg(e.message);
      }
    }
    function skip() {
      if (!confirm("Pular esta rodada? Você ganha 0 pontos nela.")) return;
      try {
        Game.skip(S, Date.now());
        gfb = null;
        chain = [];
        save();
        render();
      } catch (e) {
        msg(e.message);
      }
    }
    function nextRound() {
      gfb = null;
      chain = [];
      Game.startRound(S, Date.now());
      save();
      render();
    }
    /* Etapa 4: Feedback individual do minijogo */
    const fbGame = () => {
      const g = Game.gview(S, Date.now());
      return `<h2>Etapa 4 · Feedback</h2><p>Seu desempenho no minijogo Filtro Misterioso.</p><div class="card"><h3>Seu desempenho</h3><p>Pontos: <b>${g.score}</b></p><table class="rk"><tr><th>Rodada</th><th>Pontos</th><th>Tempo</th><th>Erros</th></tr>${Array.from(
        { length: g.total },
        (_, i) => {
          const x = g.rounds[i];
          return x
            ? `<tr><td>${i + 1}</td><td>${x.pts}${x.solved ? "" : " (pulou)"}</td><td>${x.secs}s</td><td>${x.wrong}</td></tr>`
            : `<tr><td>${i + 1}</td><td colspan="3">não jogada</td></tr>`;
        },
      ).join(
        "",
      )}</table></div><div class="card"><h3>Os filtros misteriosos da sua imagem eram</h3>${g.reveal.map((c, i) => `<p>Rodada ${i + 1}: <b>${c.map(nm).join(" → ")}</b></p><pre>${esc(E.chainPseudo(c))}</pre>`).join("")}</div>`;
    };
    /* Etapa 5: Avaliar (o gabarito só aparece no Feedback seguinte) */
    const avaliar = () => {
      const Q = Game.quizQuestions(),
        sent = !!S.quizAns;
      return (
        `<h2>Etapa 5 · Avaliar</h2>` +
        bookCard(
          "Recurso para consulta",
          "Precisa relembrar? Consulte o Cap. 2 (2.3.1), página 50.",
        ) +
        Q.map(
          (q, i) =>
            `<fieldset><legend>${i + 1}. Objetivo: ${esc(q.goal)}</legend>${["a", "b", "c"].map((o) => `<label><input type="radio" name="q${i}" value="${o}" ${sent ? "disabled" : ""} ${ans[i] == o ? "checked" : ""} onchange="ans[${i}]='${o}'"> <b>Regra ${o.toUpperCase()}</b><pre>${esc(q[o].join("\n"))}</pre></label>`).join("")}</fieldset>`,
        ).join("") +
        `<button class="p" ${sent ? "disabled" : ""} onclick="sendQuiz()">${sent ? "Enviado ✓" : "Enviar respostas"}</button> <span id="msg" role="status">${sent ? "Respostas enviadas. Clique em Continuar para ver o seu feedback." : ""}</span>`
      );
    };
    function sendQuiz() {
      if (Game.quizQuestions().some((_, i) => !ans[i]))
        return msg(
          "Responda todas as " + Game.quizQuestions().length + " questões.",
        );
      try {
        Game.submitQuiz(S, ans);
        save();
        render();
      } catch (e) {
        msg(e.message);
      }
    }
    const fbQuiz = () => {
      const f = Game.quizFeedback(S);
      return (
        `<h2>Etapa 6 · Feedback</h2><p>Seu desempenho em Avaliar.</p><p class="note">${f.answered ? `Você acertou <b>${f.score}</b> de ${f.items.length}.` : "Você não enviou respostas, mas veja o gabarito comentado abaixo."}</p>` +
        f.items
          .map(
            (q, i) =>
              `<fieldset><legend>${i + 1}. Objetivo: ${esc(q.goal)}</legend>${["a", "b", "c"].map((o) => `<div><b>Regra ${o.toUpperCase()}</b>${q.mine == o ? " ← sua resposta" : ""}${q.correct == o ? " ✔ correta" : ""}<pre>${esc(q[o].join("\n"))}</pre></div>`).join("")}<p class="err">${q.mine ? (q.ok ? "✔ Você acertou." : "✘ Você errou.") : "— Você não respondeu."}</p><p>${esc(q.why)}</p></fieldset>`,
          )
          .join("")
      );
    };
    /* Etapa 7: Criar */
    const addB = (t) => {
        blocks.push(
          t == "add" || t == "sub"
            ? { t, x: 40 }
            : t == "thr"
              ? { t, x: 128 }
              : { t },
        );
        rc();
      },
      mvB = (i, d) => {
        const j = i + d;
        if (j < 0 || j >= blocks.length) return;
        [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
        rc();
      },
      rmB = (i) => {
        blocks.splice(i, 1);
        rc();
      },
      dupB = (i) => {
        if (blocks.length < 20) blocks.splice(i, 0, { ...blocks[i] });
        rc();
      },
      rc = () => {
        res = err = null;
        render();
      };
    function runB() {
      try {
        res = Game.runBlocks(S, blocks);
        err = null;
        save();
      } catch (e) {
        res = null;
        err = e.message;
      }
      render();
    }
    const criar = () => {
      const o = me(),
        m = /Bloco (\d+)/.exec(err || "");
      return (
        `<h2>Etapa 7 · Criar</h2><p>Monte seu filtro com blocos e execute-o na sua imagem.</p><div class="g2"><div class="card"><h3>Sua imagem</h3>${cv(o, "100%")}</div><div class="card"><h3>Resultado</h3>${res ? cv(res.out, "100%") : '<p>Monte os blocos e clique em "Executar filtro".</p>'}</div></div><div class="g2"><div class="card"><h3>Blocos</h3>${Object.keys(
          BL,
        )
          .map((t) => `<button onclick="addB('${t}')">+ ${BL[t]}</button>`)
          .join(
            "",
          )}<ol>${blocks.map((b, i) => `<li ${m && +m[1] == i + 1 ? 'class="bad"' : ""}>${BL[b.t]}${b.x !== undefined ? ` X=<input type="number" style="width:5em" value="${b.x}" onchange="blocks[${i}].x=this.valueAsNumber;rc()">` : ""} <button aria-label="Subir" onclick="mvB(${i},-1)">↑</button><button aria-label="Descer" onclick="mvB(${i},1)">↓</button><button aria-label="Duplicar" onclick="dupB(${i})">⧉</button><button aria-label="Remover" onclick="rmB(${i})">✕</button></li>`).join("")}</ol><button class="p" onclick="runB()">Executar filtro</button></div><div class="card"><h3>Pseudocódigo gerado</h3><pre>${blocks.length ? esc(E.pseudo(blocks)) : "(vazio)"}</pre></div></div>` +
        (err ? `<p class="err">⚠ ${esc(err)}</p>` : "") +
        (res
          ? `<div class="card"><p>${res.invalid ? `<b class="err">${res.invalid} pixel(s) saíram de 0–255.</b> Sem blocos de limite o valor fica inválido; a tela só limita a cor. Tente "SE p > 255" ou "SE p < 0".` : "Todos os pixels ficaram entre 0 e 255."}</p></div>`
          : "")
      );
    };
    /* Etapa 8: Resumo individual */
    const resumo = () => {
      const f = Game.quizFeedback(S),
        g = Game.gview(S, Date.now()),
        o = me(),
        r = S.blocks.length ? E.run(o, S.blocks).out : null;
      return `<h2>Etapa 8 · Resumo</h2><p>Parabéns, você concluiu todas as etapas! Este resumo é só seu e fica salvo neste navegador.</p><div class="g2"><div class="card"><h3>Analisar</h3><p>Filtro Misterioso: <b>${g.score}</b> pontos.</p></div><div class="card"><h3>Avaliar</h3><p>Você acertou <b>${f.score}</b> de ${f.items.length}.</p></div></div><div class="card"><h3>Criar: seu filtro</h3>${r ? `<div class="g2"><div>${cv(o, "100%")}</div><div>${cv(r, "100%")}</div></div><pre>${esc(E.pseudo(S.blocks))}</pre>` : "<p>Nenhum filtro criado.</p>"}</div>`;
    };
    const nextBar = () =>
        S && S.stage >= 1 && S.stage < Game.LAST
          ? `<div class="card"><button class="p" ${Game.canNext(S) ? "" : "disabled"} onclick="next()">Continuar →</button> <span id="nmsg" role="status">${Game.canNext(S) ? "" : esc(Game.HINT[S.stage] || "")}</span></div>`
          : "",
      restartBar = () =>
        S
          ? '<p><button onclick="restart()">Recomeçar do zero</button></p>'
          : "";
    function render() {
      PAINT = [];
      const ph = S ? S.stage : 0;
      $("#steps").innerHTML = PH.map(
        (n, i) =>
          `<li class="s-${SC[i]} ${i < ph ? "d" : ""}" ${i == ph ? 'aria-current="step"' : ""}>${i < ph ? "✓ " : ""}${i + 1}. ${n}</li>`,
      ).join("");
      const V = !S
        ? join
        : [join, aplicar, misterioso, fbGame, avaliar, fbQuiz, criar, resumo][
            ph
          ];
      try {
        $("#main").innerHTML = V() + nextBar() + restartBar();
        paint();
      } catch (e) {
        $("#main").innerHTML =
          '<p class="err">⚠ ' + esc(e.message) + "</p>" + restartBar();
      }
    }
    setInterval(() => {
      const e = $("#tm");
      if (e && S && S.stage === 2 && S.game.t0 && !(gfb && gfb.ok))
        e.textContent = Math.floor((Date.now() - S.game.t0) / 1000);
    }, 250);
    render();
  </script>
</html>
