<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratório de Filtros</title>
<link rel="stylesheet" href="/style.css">
<header><div class="brand"><span id="logo" aria-hidden="true"></span><h1>Laboratório de Filtros</h1></div><ol class="steps" id="steps" aria-label="Etapas"></ol><div id="who"></div></header><main id="main"></main>
<script src="/engine.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LEAF=['......GG','....GGGG','...GGdGG','..GGGdG.','.GGGdGG.','GGGdGG..','.ddG....','d.......'];
$('#logo').innerHTML=`<svg viewBox="0 0 8 8" width="44" height="44" shape-rendering="crispEdges">${LEAF.map((r,y)=>[...r].map((c,x)=>c=='.'?'':`<rect x="${x}" y="${y}" width="1" height="1" fill="${c=='G'?'#3ddc97':'#241b3a'}"/>`).join('')).join('')}</svg>`;
const PH=['Entrada','Aplicar','Mural','Analisar','Ranking','Avaliar','Mural','Criar','Mural'],SC=['v','k','y','b','y','g','y','o','y'],KIND={2:'apply',8:'create'};
const FN=Object.keys(E.F),nm=n=>E.F[n].nome,BL={add:'p = p + X',sub:'p = p - X',inv:'p = 255 - p',min0:'SE p < 0, então p = 0',max255:'SE p > 255, então p = 255',thr:'SE p < X, então p = 0; SENÃO p = 255',edge:'BORDA: p = |D − E| + |B − C| (máx. 255)',blur:'SUAVIZAR: p = média de p e dos 8 vizinhos'};
let phase=-1,tok=localStorage.getItem('pdi_tok'),nick=null,pid=null,me=null,up=null,nkv='',notice='',L={x:40,y:30},chain=[],pub=0,G=null,gfb=null,sent=false,ans=[],blocks=[],res=null,err=null,PAINT=[],cn=0,qfb=null;const IM=new Map();
const api=(u,b)=>fetch(u,b?{method:'POST',body:JSON.stringify({token:tok,...b})}:{}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.erro||'Erro');return j});
async function getImg(p){if(IM.has(p))return IM.get(p);const i=E.fromB64((await api('/api/img/'+p+'?token='+(tok||''))).d);IM.set(p,i);return i}
const cv=(img,w,mark)=>{const id='c'+cn++;PAINT.push([id,img,mark]);return `<canvas id="${id}" width="${img.w}" height="${img.h}" style="width:${typeof w=='number'?w+'px':w}" ${mark?'tabindex="0" onclick="pick(event,this)" aria-label="Imagem. Clique para mover a lupa"':'role="img" aria-label="Imagem"'}></canvas>`};
const paint=()=>PAINT.splice(0).forEach(([id,img,mark])=>{const c=document.getElementById(id);if(!c)return;const x=c.getContext('2d'),im=x.createImageData(img.w,img.h);for(let i=0;i<img.d.length;i++){const v=Math.max(0,Math.min(255,img.d[i]));im.data.set([v,v,v,255],i*4)}x.putImageData(im,0,0);if(mark){x.strokeStyle='#ff5ea8';x.lineWidth=1;x.strokeRect(L.x+.5,L.y+.5,7,7)}});
const pick=(e,c)=>{const r=c.getBoundingClientRect();L.x=Math.max(0,Math.min(c.width-8,Math.round((e.clientX-r.left)/r.width*c.width-4)));L.y=Math.max(0,Math.min(c.height-8,Math.round((e.clientY-r.top)/r.height*c.height-4)));render()};
const tbl=(m,o)=>`<table class="m" aria-label="${o}">`+E.patch(m,L.x,L.y).map(r=>`<tr>${r.map(v=>{const c=Math.max(0,Math.min(255,v)),b=v!==c;return `<td ${b?'class="bad"':''} style="background:rgb(${c},${c},${c});color:${c>127?'#000':'#fff'}">${v}${b?'!':''}</td>`}).join('')}</tr>`).join('')+'</table>';
const lens=(a,b)=>`<div class="card"><h3>Lupa: pixels e números (8×8)</h3><p>Clique na imagem ou use os controles. Cada número é a intensidade do pixel (0 = preto, 255 = branco).</p><label>Horizontal <input type="range" min="0" max="${a.w-8}" value="${L.x}" onchange="L.x=+this.value;render()"></label> <label>Vertical <input type="range" min="0" max="${a.h-8}" value="${L.y}" onchange="L.y=+this.value;render()"></label><div class="row"><div><b>Antes</b>${tbl(a,'Antes')}</div><div><b>Depois</b>${tbl(b,'Depois')}</div></div></div>`;
function chainHTML(max){return `<h3>Sequência (${chain.length}/${max})</h3>`+(chain.length?`<ol>${chain.map((n,i)=>`<li>${nm(n)} <button aria-label="Subir" onclick="mv(${i},-1)">↑</button><button aria-label="Descer" onclick="mv(${i},1)">↓</button><button aria-label="Remover" onclick="rm(${i})">✕</button></li>`).join('')}</ol>`:'<p>Vazia — escolha um filtro.</p>')+FN.map(n=>`<button onclick="add('${n}',${max})">+ ${nm(n)}</button>`).join('')+`<button onclick="chain=[];pub=0;render()">Limpar</button>`}
const add=(n,m)=>{if(chain.length<m){chain.push(n);pub=0;render()}},rm=i=>{chain.splice(i,1);pub=0;render()},mv=(i,d)=>{const j=i+d;if(j<0||j>=chain.length)return;[chain[i],chain[j]]=[chain[j],chain[i]];pub=0;render()};
const pcBox=()=>chain.length?`<pre>${esc(E.chainPseudo(chain))}</pre><p>${E.F[chain.at(-1)].exp}</p>`:'<pre>(vazio)</pre><p>Adicione um filtro para ver o pseudocódigo.</p>';
async function publish(k,b){try{await api('/api/'+k,b);pub=1;render()}catch(e){$('#msg').textContent='⚠ '+e.message}}
const BODY={apply:()=>({chain}),create:()=>({blocks})};
const pubBtn=(k,dis)=>`<button class="p" ${dis||pub?'disabled':''} onclick="publish('${k}',BODY.${k}())">${pub?'Publicado ✓':'Publicar no mural'}</button> <span id="msg" role="status">${pub?'Veja no mural quando o professor liberar.':''}</span>`;
/* Etapa 1: apelido + imagem P&B (verificada aqui e de novo no servidor) */
const upPrev=()=>up?(up.ok?`<div class="row"><div><b>Original</b><br><img class="pv" alt="Prévia da imagem escolhida" src="${up.src}" style="width:192px"></div><div><b>Preto e branco</b><br>${cv(up.img,192)}</div></div>`:'')+`<p class="${up.ok?'':'err'}">${esc(up.msg)}</p>`:'';
const join=()=>`<div class="card"><h2>Etapa 1 · Entrar</h2><p>1) Escolha um apelido (não use seu nome completo).</p><input id="nk" maxlength="20" placeholder="ex.: pixel42" aria-label="Apelido" value="${esc(nkv)}" oninput="nkv=this.value;upd()"><p>2) Escolha <b>qualquer imagem</b> do seu aparelho (colorida ou não). Ela será recortada em 4:3, reduzida para 96 × 72 pixels e <b>convertida para preto e branco</b>.</p><input id="fl" type="file" accept="image/*" aria-label="Imagem do seu aparelho" onchange="onFile(this.files[0])"><div id="prev">${upPrev()}</div><button id="jb" class="p" ${up&&up.ok&&nkv.trim()?'':'disabled'} onclick="doJoin()">Entrar</button> <span id="msg" role="status"></span></div>`;
const upd=()=>{const b=$('#jb');if(b)b.disabled=!(up&&up.ok&&nkv.trim())},showPrev=()=>{const p=$('#prev');if(p){PAINT=[];p.innerHTML=upPrev();paint()}};
async function onFile(f){up=null;if(!f){showPrev();upd();return}
 try{if(f.size>8e6)throw new Error('Arquivo muito grande (máx. 8 MB).');const bmp=await createImageBitmap(f),c=document.createElement('canvas');c.width=E.W;c.height=E.H;const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,E.W,E.H);x.imageSmoothingQuality='high';
  const sw=Math.min(bmp.width,bmp.height*4/3),sh=sw*3/4;x.drawImage(bmp,(bmp.width-sw)/2,(bmp.height-sh)/2,sw,sh,0,0,E.W,E.H);const px=x.getImageData(0,0,E.W,E.H).data,rgb=new Uint8Array(E.W*E.H*3);for(let i=0;i<E.W*E.H;i++){rgb[3*i]=px[4*i];rgb[3*i+1]=px[4*i+1];rgb[3*i+2]=px[4*i+2]}
  const k=E.bwCheck(rgb);up={ok:true,rgb,img:E.grayFromRgb(rgb),src:c.toDataURL(),msg:k.ok?'✔ Imagem pronta (já era preto e branco).':'✔ Imagem colorida convertida para preto e branco.'}}
 catch(e){up={ok:false,msg:'✘ '+(/^Arquivo/.test(e.message)?e.message:'Não consegui ler esse arquivo como imagem.')}}
 showPrev();upd()}
async function doJoin(){try{const j=await api('/api/join',{nick:nkv,rgb:E.b64(up.rgb)});tok=j.token;nick=j.nick;pid=j.pid;me=up.img;IM.set(pid,me);localStorage.setItem('pdi_tok',tok);render()}catch(e){$('#msg').textContent='⚠ '+e.message}}
const espera=()=>`<div class="card"><h2>Tudo pronto, ${esc(nick)}!</h2><p>Esta é a sua imagem. Aguarde o professor liberar a próxima etapa; a tela muda sozinha.</p>${cv(me,240)}</div>`;
const aplicar=()=>{const o=me,r=E.apply(o,chain);return `<h2>Etapa 2 · Aplicar</h2><p>Experimente filtros na sua imagem e combine-os. Publique quando gostar do resultado. Você tem até o professor liberar a próxima etapa.</p><div class="g2"><div class="card"><h3>Original</h3>${cv(o,'100%',1)}</div><div class="card"><h3>Resultado</h3>${cv(r,'100%',1)}</div></div><div class="g2"><div class="card">${chainHTML(6)}<p>${pubBtn('apply',!chain.length)}</p></div><div class="card"><h3>Pseudocódigo</h3>${pcBox()}</div></div>${lens(o,r)}`};
/* Etapa 4: minijogo Filtro Misterioso (pontos e tempo calculados no servidor) */
async function loadGame(){G=await api('/api/game?token='+tok);G.t=G.target?E.fromB64(G.target):null;G.t0=Date.now()-G.elapsed}
const wait=()=>G.done||(gfb&&gfb.ok),hud=()=>`<div class="hud"><span>RODADA ${Math.min(G.round+1,G.total)}/${G.total}</span><span>PONTOS ${G.score}</span><span>ERROS ${G.wrong}</span><span>TEMPO <b id="tm">${wait()?'-':Math.floor((Date.now()-G.t0)/1000)}</b>s</span></div>`;
const final=()=>`<div class="card"><h3>Fim de jogo!</h3><p>Você fez <b>${G.score}</b> pontos.</p><table class="rk"><tr><th>Rodada</th><th>Pontos</th><th>Tempo</th><th>Erros</th></tr>${G.rounds.map((x,i)=>`<tr><td>${i+1}</td><td>${x.pts}${x.solved?'':' (pulou)'}</td><td>${x.secs}s</td><td>${x.wrong}</td></tr>`).join('')}</table><p>Aguarde o professor liberar o ranking.</p></div>`;
async function misterioso(){if(!G)await loadGame();const head='<h2>Etapa 4 · Analisar</h2><p><b>Minijogo: Filtro Misterioso</b></p>';
 if(G.done)return head+hud()+final();
 if(gfb&&gfb.ok)return head+hud()+`<div class="card"><h3>✔ Acertou! +${gfb.pts} pontos</h3><p>Filtros: <b>${gfb.expected.map(nm).join(' → ')}</b>${gfb.exact?'':' (a sua sequência é equivalente)'} · ${gfb.secs}s.</p><pre>${esc(E.chainPseudo(gfb.expected))}</pre><p>O tempo da próxima rodada só começa quando você clicar.</p><button class="p" onclick="nextRound()">Próxima rodada →</button></div>`;
 const o=me,r=E.apply(o,chain);
 return head+hud()+`<p>Um filtro misterioso transformou a <b>sua imagem</b> na imagem-alvo. Descubra a sequência de <b>${G.len}</b> filtro(s). Cada erro custa 10 pontos e o tempo também desconta. Montar e visualizar é de graça: só o envio vale!</p><div class="row"><div class="card"><h3>Original</h3>${cv(o,240)}</div><div class="card"><h3>Alvo</h3>${cv(G.t,240)}</div><div class="card"><h3>Seu teste</h3>${cv(r,240)}</div></div><div class="g2"><div class="card">${chainHTML(G.len)}<p><button class="p" ${chain.length!=G.len?'disabled':''} onclick="guess()">Enviar palpite</button> <button onclick="skip()">Pular rodada (0 pts)</button> <span id="msg" role="status"></span></p></div><div class="card"><h3>Pseudocódigo do seu teste</h3><pre>${chain.length?esc(E.chainPseudo(chain)):'(vazio)'}</pre></div></div>`
 +(gfb&&!gfb.ok?`<div class="card"><p class="err">✘ Ainda não! Seu resultado é ${Math.round(gfb.match*100)}% parecido com o alvo.</p><div class="bar" style="width:${Math.round(gfb.match*100)}%"></div></div>`:'')}
async function guess(){try{const j=await api('/api/game/guess',{chain});gfb=j;if(j.ok){G.round++;if(G.round>=G.total)await loadGame();else G.score+=j.pts;chain=[]}else G.wrong=j.wrong;render()}catch(e){$('#msg').textContent='⚠ '+e.message}}
async function skip(){if(!confirm('Pular esta rodada? Você ganha 0 pontos nela.'))return;try{await api('/api/game/skip',{});gfb=null;chain=[];await loadGame();render()}catch(e){$('#msg').textContent='⚠ '+e.message}}
async function nextRound(){gfb=null;chain=[];await loadGame();render()}
async function ranking(){const R=await api('/api/ranking'),g=await api('/api/game?token='+tok),md=['🥇','🥈','🥉'];
 return `<h2>Etapa 5 · Ranking</h2><p>Minijogo Filtro Misterioso (etapa Analisar)</p><table class="rk"><tr><th>#</th><th>Apelido</th><th>Pontos</th><th>Acertos</th><th>Tempo</th><th>Erros</th></tr>${R.map((x,i)=>`<tr class="${x.pid==pid?'me':''}"><td>${md[i]||i+1}</td><td>${esc(x.nick)}</td><td>${x.score}</td><td>${x.solved}/3</td><td>${x.secs}s</td><td>${x.wrong}</td></tr>`).join('')}</table>`+(g.reveal?`<div class="card"><h3>Os filtros misteriosos da sua imagem eram</h3>${g.reveal.map((c,i)=>`<p>Rodada ${i+1}: <b>${c.map(nm).join(' → ')}</b></p><pre>${esc(E.chainPseudo(c))}</pre>`).join('')}</div>`:'')}
async function avaliar(){const Q=await api('/api/quiz');return `<h2>Etapa 6 · Avaliar</h2>`+Q.map((q,i)=>`<fieldset><legend>${i+1}. Objetivo: ${esc(q.goal)}</legend>${['a','b','c'].map(o=>`<label><input type="radio" name="q${i}" value="${o}" ${sent?'disabled':''} ${ans[i]==o?'checked':''} onchange="ans[${i}]='${o}'"> <b>Regra ${o.toUpperCase()}</b><pre>${esc(q[o].join('\n'))}</pre></label>`).join('')}<div>${qfb?`<p class="err">${qfb.items[i].ok?'✔ Atende ao objetivo.':'✘ Não atende (correta: Regra '+qfb.items[i].correct.toUpperCase()+').'}</p><p>${esc(qfb.items[i].why)}</p>`:''}</div></fieldset>`).join('')+`<button class="p" ${sent?'disabled':''} onclick="sendQuiz()">Enviar respostas</button> <span id="msg" role="status">${qfb?`Você acertou ${qfb.score} de 4.`:''}</span>`}
async function sendQuiz(){if([0,1,2,3].some(i=>!ans[i])){$('#msg').textContent='⚠ Responda as 4 questões.';return}try{qfb=await api('/api/quiz',{answers:ans});sent=true;render()}catch(e){$('#msg').textContent='⚠ '+e.message}}
const addB=t=>{blocks.push(t=='add'||t=='sub'?{t,x:40}:t=='thr'?{t,x:128}:{t});rc()},mvB=(i,d)=>{const j=i+d;if(j<0||j>=blocks.length)return;[blocks[i],blocks[j]]=[blocks[j],blocks[i]];rc()},rmB=i=>{blocks.splice(i,1);rc()},dupB=i=>{if(blocks.length<20)blocks.splice(i,0,{...blocks[i]});rc()},rc=()=>{res=err=null;pub=0;render()};
function runB(){try{res=E.run(me,blocks);err=null}catch(e){res=null;err=e.message}pub=0;render()}
const criar=()=>{const o=me,m=/Bloco (\d+)/.exec(err||'');return `<h2>Etapa 8 · Criar</h2><p>Monte seu filtro com blocos e execute-o na sua imagem. Novos: <b>Borda</b> compara cada pixel com seus vizinhos (E = esquerda, D = direita, C = cima, B = baixo): onde a diferença é grande, há um contorno. <b>Suavizar</b> troca cada pixel pela média dele e dos 8 vizinhos, o que borra a imagem e reduz ruído. Fora da imagem vale o pixel mais próximo.</p><div class="g2"><div class="card"><h3>Sua imagem</h3>${cv(o,'100%')}</div><div class="card"><h3>Resultado</h3>${res?cv(res.out,'100%'):'<p>Monte os blocos e clique em "Executar filtro".</p>'}</div></div><div class="g2"><div class="card"><h3>Blocos</h3>${Object.keys(BL).map(t=>`<button onclick="addB('${t}')">+ ${BL[t]}</button>`).join('')}<ol>${blocks.map((b,i)=>`<li ${m&&+m[1]==i+1?'class="bad"':''}>${BL[b.t]}${b.x!==undefined?` X=<input type="number" style="width:5em" value="${b.x}" onchange="blocks[${i}].x=this.valueAsNumber;rc()">`:''} <button aria-label="Subir" onclick="mvB(${i},-1)">↑</button><button aria-label="Descer" onclick="mvB(${i},1)">↓</button><button aria-label="Duplicar" onclick="dupB(${i})">⧉</button><button aria-label="Remover" onclick="rmB(${i})">✕</button></li>`).join('')}</ol><button class="p" onclick="runB()">Executar filtro</button></div><div class="card"><h3>Pseudocódigo gerado</h3><pre>${blocks.length?esc(E.pseudo(blocks)):'(vazio)'}</pre></div></div>`
+(err?`<p class="err">⚠ ${esc(err)}</p>`:'')+(res?`<div class="card"><p>${res.invalid?`<b class="err">${res.invalid} pixel(s) saíram de 0–255.</b> Sem blocos de limite o valor fica inválido; a tela só limita a cor. Tente "SE p > 255" ou "SE p < 0".`:'Todos os pixels ficaram entre 0 e 255.'}</p>${pubBtn('create')}</div>`:'')};
async function wallLoad(){const k=KIND[phase],el=$('#wall');if(!el||!k)return;const W=await api('/api/wall/'+k);await Promise.all([...new Set(W.map(e=>e.pid))].map(getImg));
 const seen=new Set(),L2=W.filter(e=>!seen.has(e.pid)&&seen.add(e.pid)); // uma por aluno: a mais recente
 el.innerHTML=L2.length?L2.map(e=>{const o=IM.get(e.pid),r=k=='create'?E.run(o,e.blocks).out:E.apply(o,e.chain);return `<div class="card"><b>${esc(e.nick)}</b><br>${cv(r,150)}${k=='create'?`<details><summary>Pseudocódigo</summary><pre>${esc(e.pseudo)}</pre></details>`:''}</div>`}).join(''):'<p>Nenhuma publicação.</p>';paint()}
const wallView=(t,sub)=>`<h2>${t}</h2><p>${sub}</p><div id="wall" class="row"></div>`,muralA=()=>wallView('Etapa 3 · Mural','Resultados da etapa Aplicar'),muralC=()=>wallView('Etapa 9 · Mural','Resultados da etapa Criar'),muralQ=()=>`<h2>Etapa 7 · Mural</h2><p>Resultados da etapa Avaliar (anônimo)</p><div id="stats" class="card"></div>`;
async function stats(){const el=$('#stats');if(!el)return;const s=await api('/api/quiz/stats');el.innerHTML=s.total?`<p>${s.total} submissão(ões) considerada(s).</p>`+[4,3,2,1,0].map(k=>{const p=Math.round(100*s.dist[k]/s.total);return `<div>${p}% acertaram ${k} questão(ões) <div class="bar" style="width:${p}%"></div></div>`}).join(''):'<p>Nenhuma resposta ainda.</p>'}
let busy=0,again=0;
async function render(){if(busy){again=1;return}busy=1;try{PAINT=[];$('#steps').innerHTML=PH.map((n,i)=>`<li class="s-${SC[i]} ${i<phase?'d':''}" ${i==phase?'aria-current="step"':''}>${i<phase?'✓ ':''}${i+1}. ${n}</li>`).join('');$('#who').innerHTML=nick?`<span class="note">Você: <b>${esc(nick)}</b></span>`:'';
 if(nick&&!me)me=await getImg(pid);const V=!nick?join:[espera,aplicar,muralA,misterioso,ranking,avaliar,muralQ,criar,muralC][phase];
 $('#main').innerHTML=(notice?`<p class="note" role="status">${esc(notice)}</p>`:'')+await V();paint();if(KIND[phase])wallLoad();if(phase==6)stats()}catch(e){$('#main').innerHTML='<p class="err">⚠ '+esc(e.message)+'</p>'}busy=0;if(again){again=0;render()}}
async function poll(){try{const s=await api('/api/state?token='+(tok||''));if(!s.nick&&tok){tok=null;me=null;pid=null;localStorage.removeItem('pdi_tok')}const nn=s.nick!==nick;nick=s.nick;pid=s.pid;
 if(s.phase!==phase||nn){const prev=phase;phase=s.phase;chain=[];pub=0;res=err=null;gfb=null;if(phase==3)G=null;notice='';await render()}else{if(KIND[phase])wallLoad();if(phase==6)stats()}}catch(e){}}
setInterval(()=>{const e=$('#tm');if(e&&G&&!wait()&&phase==3)e.textContent=Math.floor((Date.now()-G.t0)/1000)},250);
poll();setInterval(poll,2000);
</script>
</html>
